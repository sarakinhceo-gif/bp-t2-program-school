<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="174" cy="130" r="89" fill="#16213e" opacity="0.07"/>
    <circle cx="-66" cy="209" r="29" fill="#16213e" opacity="0.14"/>
    <circle cx="354" cy="65" r="43" fill="#16213e" opacity="0.09"/>
    <circle cx="826" cy="654" r="92" fill="#16213e" opacity="0.18"/>
    <circle cx="312" cy="84" r="57" fill="#16213e" opacity="0.18"/>
    <circle cx="1145" cy="55" r="78" fill="#16213e" opacity="0.19"/>
    <rect x="274" y="217" width="33" height="55" rx="8" fill="#1a1a2e" opacity="0.13" transform="rotate(33, 970, 451)"/>
    <rect x="-3" y="-37" width="33" height="38" rx="8" fill="#1a1a2e" opacity="0.07" transform="rotate(27, 472, -41)"/>
    <rect x="1235" y="639" width="71" height="32" rx="8" fill="#1a1a2e" opacity="0.12" transform="rotate(16, 1158, 250)"/>
    <rect x="718" y="372" width="45" height="25" rx="8" fill="#1a1a2e" opacity="0.11" transform="rotate(38, 249, 507)"/>
    <rect x="1027" y="139" width="20" height="44" rx="8" fill="#1a1a2e" opacity="0.04" transform="rotate(21, 463, 197)"/>
    <rect x="86" y="667" width="36" height="75" rx="8" fill="#1a1a2e" opacity="0.08" transform="rotate(15, 580, 121)"/>
    <rect x="773" y="296" width="41" height="85" rx="8" fill="#1a1a2e" opacity="0.11" transform="rotate(0, 320, 493)"/>
    <rect x="-5" y="535" width="34" height="92" rx="8" fill="#1a1a2e" opacity="0.15" transform="rotate(13, 1247, -64)"/>
    <polygon points="1100,303 1129,361 1071,361" fill="#16213e" opacity="0.03"/>
    <polygon points="1028,454 1122,642 934,642" fill="#16213e" opacity="0.09"/>
    <polygon points="-73,572 -22,674 -124,674" fill="#16213e" opacity="0.12"/>
    <polygon points="79,584 147,720 11,720" fill="#16213e" opacity="0.05"/>

  <!-- Wave at bottom -->
  <path d="M0,556 C360,593 840,519 1200,556 L1200,630 L0,630Z" fill="#16213e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    4-에이전트 루프 자동화 프로그램 코딩 스쿨
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 무인 마케팅 스쿨
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#e94560" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     4-에이전트 루프 자동화 프로그램 코딩 스쿨 — 무인 마케팅 스쿨
  </text>
</svg>